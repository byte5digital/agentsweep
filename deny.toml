# Dependency policy for AgentSweep, enforced by `cargo deny` in CI.
#
# AgentSweep is a security utility that ships as a notarized macOS bundle, so a
# dependency reaches a user's machine with the same privileges the user has.
# Three questions decide whether it may: is it free of known advisories, is its
# licence compatible with Apache-2.0, and does it come from crates.io.

[graph]
# macOS 14 and later, universal binary. The core is portable, so the other
# targets return with the integration layer for Windows and Linux.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
all-features = true

[advisories]
# A known advisory fails the build. Every exception is an entry below with a
# reason, never a relaxed default.
yanked = "deny"
ignore = [
    # All five come from the rule engine. YARA-X 1.20 requires wasmtime
    # 45.0.3, and the wasmtime advisories below have no fix on the 45 line, so
    # none of them can be resolved by an upgrade. Revisit on every YARA-X
    # release: the exception goes the moment a version that takes a patched
    # wasmtime exists.
    #
    # Unmaintained, not a vulnerability. YARA-X uses bincode to serialise
    # compiled rules. AgentSweep compiles its Rule Pack from source and
    # verifies the Rule Feed's signature before it reads a pack at all, so no
    # untrusted bincode stream is ever decoded.
    "RUSTSEC-2025-0141",
    # Type indices can be mixed up between two wasmtime engines. YARA-X builds
    # one engine, and the WebAssembly it runs is generated by its own compiler
    # from a signed Rule Pack, never supplied by an attacker.
    "RUSTSEC-2026-0222",
    # A filesystem sandbox escape in wasmtime's WASI filesystem preopens.
    # YARA-X depends on wasmtime with the `runtime` and `cranelift` features
    # only, so `wasmtime-wasi` is not in the dependency graph and the
    # vulnerable code is never compiled in.
    "RUSTSEC-2026-0269",
    # Dynamic record lifting in the component model can allocate past the
    # hostcall fuel limit. YARA-X runs core WebAssembly modules from its own
    # compiler and never instantiates a component, so no record is ever
    # lifted dynamically and the fuel limit is not what bounds its runs.
    # Accepted by the owner on 2026-09-29.
    "RUSTSEC-2026-0316",
    # A stack buffer overflow from an unvalidated result count of an
    # async-lifted callback in the component model. Like the entry above,
    # it lives in code YARA-X never reaches: it runs core WebAssembly modules
    # from its own compiler and never instantiates a component. No wasmtime
    # 45 release carries the fix and YARA-X 1.21 still requires 45. Accepted
    # by the owner on 2026-10-14.
    "RUSTSEC-2026-0327",
    # The next five come from the menu bar app. Tauri 2.11.5 matches the URLs
    # of its capabilities with `urlpattern`, which reads identifiers with the
    # unic Unicode tables, and those are unmaintained, not vulnerable. The app
    # declares no remote URL at all, so the matcher only ever reads the app's
    # own configuration. Revisit on every Tauri 2 release.
    "RUSTSEC-2025-0075", # unic-char-range, unmaintained, through Tauri's urlpattern
    "RUSTSEC-2025-0080", # unic-common, unmaintained, through Tauri's urlpattern
    "RUSTSEC-2025-0081", # unic-char-property, unmaintained, through Tauri's urlpattern
    "RUSTSEC-2025-0098", # unic-ucd-version, unmaintained, through Tauri's urlpattern
    "RUSTSEC-2025-0100", # unic-ucd-ident, unmaintained, through Tauri's urlpattern
]

[licenses]
# Apache-2.0 for AgentSweep itself, including the rule corpus. The permissive
# licences below are the ones a dependency may carry. Anything else needs an
# entry under `exceptions` and a look at what it obliges us to ship.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    # The BSD Zero Clause License: the two-clause licence with both clauses
    # struck out, so it obliges a binary to carry neither a notice nor a
    # copyright line. It asks strictly less than MIT, which is allowed above.
    # It reaches the bundle through the Unix socket crate and its helpers.
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
exceptions = [
    # The Mozilla root certificate bundle, carried by the HTTPS client that
    # fetches the benign corpus in CI and, in the daemon, the Rule Feed (spec
    # section 9.4). CDLA-Permissive-2.0 is a permissive data licence with no
    # copyleft and no attribution requirement on a binary, and the bundle is
    # data rather than code. Since the Rule Feed it reaches the daemon a user
    # installs; it never reaches the app or the CLI.
    { name = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
    # The watcher. CC0-1.0 is a dedication to the public domain, so it obliges
    # a binary to carry neither a notice nor a copyright line and asks strictly
    # less than the MIT licence allowed above. It is named here rather than
    # allowed everywhere because a public domain dedication is unusual enough
    # to be worth reading each time it turns up.
    { name = "notify", allow = ["CC0-1.0"] },
    # MPL-2.0 is copyleft per file: it asks that the source of those files
    # stays available, which crates.io does for an unmodified crate, and puts
    # nothing on the rest of the program. Each is named rather than allowed
    # everywhere, so a new MPL crate is read before it ships.
    #
    # Tauri's build-time HTML handling, which writes the content security
    # policy into the frontend. They run inside the Tauri proc macro and reach
    # no binary.
    { name = "cssparser", allow = ["MPL-2.0"] },
    { name = "cssparser-macros", allow = ["MPL-2.0"] },
    { name = "dtoa-short", allow = ["MPL-2.0"] },
    { name = "selectors", allow = ["MPL-2.0"] },
    # Tauri's lookup of the standard directories, through `dirs`. It is in the
    # app binary, unmodified.
    { name = "option-ext", allow = ["MPL-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Everything comes from crates.io. A git dependency would put code in the bundle
# that no registry ever saw, so it needs a deliberate entry here.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
