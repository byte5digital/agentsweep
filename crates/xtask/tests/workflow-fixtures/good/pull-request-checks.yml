name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show the toolchain
        run: cargo --version && cargo clippy --version
      - name: Test
        run: |
          # A shell comment saying cargo build is not a command.
          cargo test --workspace \
            --locked
          cargo install --locked cargo-auditable && cargo auditable build --locked --release
      - name: Use the token every job has
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api repos/example/agentsweep
      - uses: ./local-action
