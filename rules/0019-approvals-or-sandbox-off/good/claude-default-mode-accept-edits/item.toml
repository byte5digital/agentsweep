# Near miss: a permission mode that still asks before anything but file edits.
[item]
agent = "claude-code"
kind = "SettingsEntry"
shape = "entry"
scope = "user"
path = ".claude/settings.json#/permissions/defaultMode"
provenance = "manual"
activation = "active"
registered = true
file_type = "text"

[settings]
key_path = "permissions.defaultMode"
value = "acceptEdits"
value_host = ""

[expect]
fire = []
