[package]
name = "agentsweep-menubar"
description = "The AgentSweep menu bar app: a Tauri 2 shell over the daemon, which it registers, supervises and renders the Health of."
# The app ships inside the notarized bundle and nowhere else.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "agentsweep_menubar"
path = "src/lib.rs"

[[bin]]
name = "agentsweep-menubar"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
# Health and its precedence, the same sentence the command line interface
# prints. Never the `daemon` feature: the app writes no store. The `apple`
# feature only for onboarding screen 4, which asks the Apple judgement helper
# beside the app whether Apple's on-device model is available before any
# daemon runs (spec section 4.4); the app never judges an Item.
agentsweep-core = { workspace = true, features = ["apple"] }
# The client half of the vocabulary. The app is a peer of the daemon like the
# in-bundle command line interface, with the role `app`.
agentsweep-ipc.workspace = true
# The onboarding Inventory (spec section 6.8): the app calls each Agent
# adapter's `detect` and `projects` itself, on a confined Host, and never
# `enumerate`. Nothing else of the adapters is used by the app.
agentsweep-adapter-claude-code.workspace = true
agentsweep-adapter-codex.workspace = true
serde_json = "1.0.151"
# The shell (spec section 6.1): Tauri 2.11.5, the last 2.x, with the tray.
tauri = { version = "=2.11.5", features = ["tray-icon"] }
# Notifications (spec sections 6.1, 6.7 and 8.7), raised by the app only. On
# macOS it posts through notify-rust and mac-notification-sys; no click
# callbacks on desktop, so a click activates the app through the operating
# system and the app opens its window on Needs your decision.
tauri-plugin-notification = "=2.4.0"
# The app updater (spec section 9.4): the second of the three disclosed
# requests, a GET of the fixed `latest.json` with no identifiers, a minisign
# signature check of the downloaded archive against the key pinned in
# `tauri.conf.json`, and the install on the next quit. 2.12 is the last line
# that runs on Tauri 2.11; 2.13 and later need 2.12. Rustls only: no system
# proxy lookup and no zip, which only the Windows installer reads.
tauri-plugin-updater = { version = "=2.12.0", default-features = false, features = ["rustls-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
# SMAppService: the daemon as a launch agent from the plist inside the bundle,
# and the app as a login item (spec section 9.5). The file manager moves the
# app to the Trash on Uninstall (spec section 9.6).
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSError", "NSNotification", "NSOperation", "block2", "NSFileManager", "NSURL", "NSUserDefaults"] }
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
# The native folder picker behind "Scan a folder" (AppKit's NSOpenPanel). MIT.
# Called from Rust, so the webview gets no dialog or file system permission.
rfd = { version = "0.17.2", default-features = false }
# The general pasteboard behind "Copy a message for your admin" (spec section
# 8.4). Already in the tree through Tauri; only the pasteboard is asked for.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSWorkspace", "NSApplication"] }
# A click on a notification activates the app; the app observes that through
# NSNotificationCenter with a block (spec section 6.1: no click callbacks).
# Already in the tree through Tauri.
block2 = "0.6.2"

[dev-dependencies]
# The updater's tests run the real plugin on Tauri's mock runtime, against a
# loopback fixture server; the shipped app never builds the mock runtime.
tauri = { version = "=2.11.5", features = ["tray-icon", "test"] }
# Signs the fixture archive with the development updater key, the way the
# Tauri command line interface signs the release archive.
minisign = "0.10.0"
base64 = "0.22.1"
# The window's tests run a real daemon in the process, on a temporary home,
# with the chain key in memory. Test builds only: the app never links it.
agentsweep-core = { workspace = true, features = ["development-keys"] }
agentsweep-daemon = { path = "../../crates/daemon" }
tempfile = "3.27.0"
