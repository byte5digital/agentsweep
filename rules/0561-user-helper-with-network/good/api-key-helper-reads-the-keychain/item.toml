# Near miss: the key helper asks the Keychain, which never leaves the machine.
[item]
agent = "claude-code"
kind = "SettingsEntry"
shape = "entry"
scope = "user"
path = ".claude/settings.json#/apiKeyHelper"
provenance = "manual"
activation = "active"
registered = true
file_type = "text"

[settings]
key_path = "apiKeyHelper"
value = "security find-generic-password -s anthropic-api -w"
value_host = ""

[expect]
fire = []
