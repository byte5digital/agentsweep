name: Cask bump

on:
  release:
    types: [published]

jobs:
  bump:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.TAP_TOKEN }}
