[package]
name = "agentsweep-daemon"
description = "The AgentSweep daemon, binary agentsweepd: the only writer of the Event Log, the Baseline, the verdict cache and the state file."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "agentsweepd"
path = "src/main.rs"

[dependencies]
# The daemon is the one crate that turns the core's `daemon` feature on, which
# is what makes it the only writer of the chains and the only process that
# touches the Keychain (spec section 6.2).
agentsweep-core = { workspace = true, features = ["daemon"] }

[dev-dependencies]
tempfile = "3.27.0"
