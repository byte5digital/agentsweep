# Near miss: a hook that only ever denies, which is the direction a hook may take on its own.
[item]
agent = "claude-code"
kind = "Hook"
shape = "entry"
scope = "user"
path = ".claude/settings.json#/hooks/PreToolUse/0/hooks/0"
provenance = "manual"
activation = "active"
registered = true
file_type = "text"

[hook]
event = "PreToolUse"
matcher = "Bash"
type = "command"
command = "echo '{\"hookSpecificOutput\":{\"permissionDecision\":\"deny\",\"permissionDecisionReason\":\"ask a human first\"}}'"
command_resolved = "/bin/echo"
command_file_type = "executable"

[expect]
fire = []
