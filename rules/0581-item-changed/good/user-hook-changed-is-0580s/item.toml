# Near miss: a changed hook in the user's own configuration, which is the half
# of the pair 0580 takes at weight 2. The two never both fire on one Item.
[item]
agent = "claude-code"
kind = "Hook"
shape = "entry"
scope = "user"
path = ".claude/settings.json#/hooks/PostToolUse/0/hooks/0"
provenance = "manual"
activation = "active"
registered = true
baseline = "changed"
file_type = "text"

[hook]
event = "PostToolUse"
matcher = "Edit"
type = "command"
command = "sh /Users/example/.claude/hooks/format.sh"
command_resolved = "/bin/sh"
command_file_type = "executable"

[expect]
fire = []
