[package]
name = "agentsweep-daemon"
description = "The AgentSweep daemon, binary agentsweepd: the only writer of the Event Log, the Baseline, the verdict cache and the state file."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "agentsweep_daemon"
path = "src/lib.rs"

[[bin]]
name = "agentsweepd"
path = "src/main.rs"

[dependencies]
agentsweep-adapter-claude-code.workspace = true
agentsweep-adapter-codex.workspace = true
agentsweep-adapter-workspace.workspace = true
# The daemon is the one crate that turns the core's `daemon` feature on, which
# is what makes it the only writer of the chains and the only process that
# touches the Keychain (spec section 6.2).
agentsweep-core = { workspace = true, features = ["daemon"] }
agentsweep-ipc.workspace = true
# The jitter of the Rule Feed fetch: up to an hour, drawn from the operating
# system's generator, so a fleet of clients does not ask in the same minute.
getrandom = "0.4.3"
# Whether the process a Claude Code session file names is still running: a
# `kill` with signal zero, which sends nothing. Never a process listing, never
# a program run (spec section 5.3).
libc = "0.2.180"
# The watcher. FSEvents and never kqueue, which is a file descriptor per file
# and runs out at a few hundred of them (spec section 6.1). The debounce and
# the batching are AgentSweep's own, because what the specification asks for,
# two seconds quiet with a fifteen second maximum hold over one batch of paths,
# is not what an event debouncer does per path.
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
serde_json = "1.0.151"
# The log (spec section 6.9): `tracing` to a file under ~/Library/Logs/AgentSweep
# that AgentSweep rotates itself at five files of five megabytes, or to the
# terminal for a developer run. No colours and no `log` bridge: the formatter
# and nothing else.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
# The Rule Feed fetch, the one outbound request the daemon makes (spec section
# 1.1). The client and configuration the pack build already uses: rustls, no
# compression, no cookies.
ureq ={ version = "3.4.2", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The peer check of ADR 0008: whether the process on the other end of the
# socket carries byte5's code signature. Only the daemon asks.
core-foundation = "0.10.1"
# Low Power Mode, read off NSProcessInfo and nothing else. The smallest
# binding that reaches it: one class, no AppKit and no run loop.
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo"] }
security-framework-sys = "2.17.0"

[dev-dependencies]
# The fixture homes the daemon's own tests scan. A test never goes near the
# real home.
agentsweep-adapter-conformance = { version = "0.1.0", path = "../adapter-conformance" }
agentsweep-adapter-workspace = { workspace = true, features = ["testing"] }
# Signs the test Rule Packs a fixture Rule Feed serves, with the development
# keys the binary pins until the real key pairs exist.
agentsweep-core = { workspace = true, features = ["daemon", "development-keys"] }
# The Rule Pack release workflow's own release writer and signing step, so a
# test proves the client accepts what the workflow publishes.
agentsweep-xtask = { path = "../xtask" }
tempfile = "3.27.0"
