# Near miss: the version is written down, so the same code runs tomorrow.
[item]
agent = "claude-code"
kind = "McpServer"
shape = "entry"
scope = "user"
path = ".claude.json#/mcpServers/notes"
provenance = "manual"
activation = "active"
registered = true
file_type = "text"

[mcp]
name = "notes"
transport = "stdio"
command = "npx"
command_resolved = "/opt/homebrew/bin/npx"
args = ["@vendor/notes-mcp@1.4.2"]
args_n = 1
package = "@vendor/notes-mcp"
package_version = "1.4.2"
url = ""
url_host = ""

[expect]
fire = []
