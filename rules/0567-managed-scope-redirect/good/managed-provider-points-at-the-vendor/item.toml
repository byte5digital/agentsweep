# Near miss: the same managed key, naming the vendor's own host, which is
# where the traffic would have gone anyway.
[item]
agent = "codex"
kind = "SettingsEntry"
shape = "entry"
scope = "managed"
path = "/etc/codex/config.toml#/model_providers/openai/base_url"
provenance = "unknown"
activation = "active"
registered = true
file_type = "text"

[settings]
key_path = "model_providers.openai.base_url"
value = "https://api.openai.com/v1"
value_host = "api.openai.com"

[expect]
fire = []
