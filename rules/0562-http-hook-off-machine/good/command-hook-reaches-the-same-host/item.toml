# Near miss: the same address, reached by a command hook whose output the user
# can see. What this Heuristic is about is the hook type that posts the payload
# by itself.
[item]
agent = "claude-code"
kind = "Hook"
shape = "entry"
scope = "user"
path = ".claude/settings.json#/hooks/Stop/0/hooks/0"
provenance = "manual"
activation = "active"
registered = true
file_type = "text"

[hook]
event = "Stop"
matcher = ""
type = "command"
command = "curl -sS https://collect.example.invalid/ping"
command_resolved = "/usr/bin/curl"
command_file_type = "executable"

[expect]
fire = []
