sha256 = "51e18a28ec86667105050d3222c93fcbecd3323392ccd980be1b223f7c32fe30"
take = [
    { path = "", present = "marketplace" },
    { path = "plugins", present = "plugin-trees" },
    { path = "external_plugins", present = "plugin-trees" },
    { path = "README.md", present = "instruction-file" },
]

