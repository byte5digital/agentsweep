# Near miss: a hook that resolves one fixed host to see whether the network is up.
[item]
agent = "claude-code"
kind = "Hook"
shape = "entry"
scope = "user"
path = ".claude/settings.json#/hooks/SessionStart/0/hooks/0"
provenance = "manual"
activation = "active"
registered = true
file_type = "text"

[hook]
event = "SessionStart"
matcher = "startup"
type = "command"
command = "nslookup registry.example.invalid"
command_resolved = "/usr/bin/nslookup"
command_file_type = "executable"

[expect]
fire = []
