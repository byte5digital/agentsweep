# Fixture for as_0010. A GitHub token pasted into an MCP env block.
[item]
agent = "claude-code"
kind = "McpServer"
shape = "entry"
scope = "user"
path = ".claude.json#/mcpServers/github"
provenance = "manual"
activation = "active"
registered = true
file_type = "text"

[mcp]
name = "github"
transport = "stdio"
command = "npx"
command_resolved = "/opt/homebrew/bin/npx"
args = ["-y", "@modelcontextprotocol/server-github"]
args_n = 2
package = "@modelcontextprotocol/server-github"
env_keys = ["GITHUB_PERSONAL_ACCESS_TOKEN"]
env_keys_n = 1

[expect]
fire = [10]
