[package]
name = "agentsweep-xtask"
description = "Build work for the AgentSweep Rule corpus and Rule Pack: the corpus runner, the Indicator List rendering and the pack build."
# Nothing ships this: it is the build side of the corpus and of a pack release.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "agentsweep-xtask"
path = "src/main.rs"

[dependencies]
agentsweep-adapter-claude-code.workspace = true
agentsweep-adapter-codex.workspace = true
agentsweep-adapter-workspace.workspace = true
# The eval harness asks the three Judgement Engines by hand (spec section 4.4,
# "Eval gate"): the Claude API client lives behind `daemon` and the Apple
# helper behind `apple`. The eval takes its Claude key from a file or standard
# input and never reads the Keychain, appends to a chain or writes a store.
agentsweep-core = { workspace = true, features = ["apple", "daemon"] }
flate2 = "1.1.10"
# Only the checksum of the index a bad corpus sample's repository is laid out
# with; no git binary is ever run.
gix-hash = { version = "0.26.2", features = ["sha1"] }
# The minisign compatible signer of a Rule Pack release: one detached,
# prehashed signature over the manifest per Rule Pack secret key the release
# workflow's environment holds (spec section 9.4). It is built from crates.io
# with `--locked` like every other tool CI builds, and it runs in the release
# workflow alone: no shipped binary signs anything.
minisign = "0.10.0"
serde_json = "1.0.151"
tar = { version = "0.4.46", default-features = false }
# Only the parser: the corpus runner reads an `item.toml` and writes nothing.
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde", "std"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.27.0"
