[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/cli",
    "crates/daemon",
    "crates/ipc",
    "crates/adapters/claude-code",
    "crates/adapters/codex",
    "crates/adapters/workspace",
    "crates/adapter-conformance",
    "crates/xtask",
    "apps/menubar",
]

# Inherited by every crate in the workspace. The stable toolchain is pinned here
# as `rust-version`, as the specification requires; `rust-toolchain.toml` pins
# the same version for CI.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
repository = "https://github.com/byte5digital/agentsweep"
authors = ["The AgentSweep contributors"]

[workspace.dependencies]
agentsweep-core = { version = "0.1.0", path = "crates/core" }
agentsweep-ipc = { version = "0.1.0", path = "crates/ipc" }
agentsweep-adapter-claude-code = { version = "0.1.0", path = "crates/adapters/claude-code" }
agentsweep-adapter-codex = { version = "0.1.0", path = "crates/adapters/codex" }
agentsweep-adapter-workspace = { version = "0.1.0", path = "crates/adapters/workspace" }

# Debug and test builds keep line tables for the workspace's own crates, so a
# backtrace names file and line, and no debug info for dependencies: nobody
# steps through YARA-X, wasmtime or Tauri in a debugger, and full debug info
# made every build directory tens of gigabytes. Release builds are unchanged.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
