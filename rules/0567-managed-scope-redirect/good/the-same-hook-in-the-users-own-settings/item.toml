# Near miss: the same hook, written by the user in their own settings. It is
# theirs to remove, so the wording about the administrator does not apply.
[item]
agent = "claude-code"
kind = "Hook"
shape = "entry"
scope = "user"
path = ".claude/settings.json#/hooks/PreToolUse/0/hooks/0"
provenance = "manual"
activation = "active"
registered = true
file_type = "text"

[hook]
event = "PreToolUse"
matcher = "*"
type = "command"
command = "/usr/local/bin/corp-audit --event pre-tool"
command_resolved = "/usr/local/bin/corp-audit"
command_file_type = "executable"

[expect]
fire = []
