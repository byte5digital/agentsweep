name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing in CI writes to the repository and no job may reach a release secret.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A dependency that fails to fetch should fail the job, not hang it.
  CARGO_NET_RETRY: 3

jobs:
  sign-off:
    name: Sign-off
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the Developer Certificate of Origin sign-off
        env:
          DCO_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DCO_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/dco-check.sh "${DCO_BASE}" "${DCO_HEAD}"

  build:
    name: Build, lint and test
    # macOS 14 is the minimum the product supports, so it is what CI builds on.
    runs-on: macos-14
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        run: .github/scripts/install-toolchain.sh

      - name: Check the formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # The command line interface is two builds with one name (ADR 0008). The
      # workspace builds the crates.io one, its default features, which runs a
      # Folder Scan and nothing else and links no IPC code; the in-bundle one,
      # feature `bundle`, is built, linted and tested on its own features here.
      # Its test suite also runs the crates.io build beside it and asserts both
      # print the same bytes for a Folder Scan.
      - name: Build, lint and test the in-bundle build of the command line interface
        run: |
          cargo build -p agentsweep --features bundle --locked
          cargo clippy -p agentsweep --features bundle --all-targets --locked -- -D warnings
          cargo test -p agentsweep --features bundle --locked

      # The crates that go to crates.io (the core, the three adapters, the IPC
      # crate and the command line interface) are packaged in publishing order,
      # each tarball is built on its own, and the command line interface is
      # tested from its package. Nothing is uploaded.
      - name: Package the publishable crates and test the command line interface from its package
        run: .github/scripts/package-check.sh

      # cargo-auditable and cargo-deny are built from crates.io with the pinned
      # toolchain rather than pulled as prebuilt binaries by a third party
      # action, so the only code CI runs comes from the one registry the
      # dependency policy allows.
      - name: Build with an embedded dependency list
        run: |
          cargo install --locked cargo-auditable
          cargo auditable build --workspace --locked --release

  app-bundle:
    name: App bundle
    # The menu bar app is built into a bundle the way the release builds it:
    # universal (arm64 plus x86_64), with the daemon and the command line
    # interface as external binaries and the launch agent's plist inside, and
    # signed ad hoc. No notarization and no secret: that is the release
    # pipeline's, behind its own environment.
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain with both Apple targets
        run: .github/scripts/install-toolchain.sh aarch64-apple-darwin x86_64-apple-darwin

      # Built from crates.io with the pinned toolchain, as in the build job.
      - name: Install cargo-auditable
        run: cargo install --locked cargo-auditable

      # The Apple judgement helper is Swift against Foundation Models, which
      # needs a macOS 26 SDK to build; its own minimum stays macOS 14. Its
      # tests never reach the model, so they pass on a runner without Apple
      # Intelligence.
      - name: Test the Apple judgement helper
        run: |
          sdk="$(xcrun --show-sdk-path)"
          echo "SDK: $(xcrun --show-sdk-version)"
          test -d "$sdk/System/Library/Frameworks/FoundationModels.framework" || {
            echo "the selected SDK has no Foundation Models; the helper needs macOS 26 or later" >&2
            exit 1
          }
          apps/apple-judge/test.sh

      # Release sidecars, so the bundle carries what a release ships: each one
      # built for both Apple triples through cargo auditable and joined with
      # lipo. Nothing here runs the daemon, so the empty Team ID that makes a
      # release daemon admit nobody does not matter.
      - name: Build the universal sidecars
        env:
          TARGET: universal-apple-darwin
        run: apps/menubar/build-sidecars.sh release

      # The Tauri command line interface from npm, pinned to the exact version
      # of the tauri crate the workspace locks. What follows `--` goes to cargo.
      # `createUpdaterArtifacts` signs the updater archive; here with the
      # development updater key, whose public half `tauri.conf.json` pins
      # until the release prerequisites produce the real one. Its secret half
      # is committed for this and the tests alone, encrypted with an empty
      # password; the release signs with the updater key from the `release`
      # environment.
      - name: Build the universal bundle
        working-directory: apps/menubar
        env:
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          TAURI_SIGNING_PRIVATE_KEY="$(cat development-keys/updater-development.secret)" \
            npx --yes @tauri-apps/cli@2.11.5 build --target universal-apple-darwin --config tauri.bundle.conf.json -- --locked

      - name: Check what the bundle carries
        run: |
          app=target/universal-apple-darwin/release/bundle/macos/AgentSweep.app
          test -x "$app/Contents/MacOS/agentsweep-menubar"
          test -x "$app/Contents/MacOS/agentsweepd"
          test -x "$app/Contents/MacOS/agentsweep"
          test -x "$app/Contents/MacOS/agentsweep-apple-judge"
          plutil -lint "$app/Contents/Library/LaunchAgents/de.byte5.agentsweep.daemon.plist"
          test "$(plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist")" = "14.0"
          test "$(plutil -extract LSUIElement raw "$app/Contents/Info.plist")" = "true"
          # The updater archive and its signature (spec section 9.4).
          test -s "$app.tar.gz"
          test -s "$app.tar.gz.sig"

      # The release bundle checker, release checklist items 2, 3, 14, 15 and
      # 16, in ad hoc mode: every Mach-O in the bundle verifies strictly, is
      # universal, has the hardened runtime and no entitlements, and the
      # daemon carries its frozen signing identifier, because the Keychain key
      # is bound to it. The daemon embeds an Info.plist naming it, so Tauri's
      # own signing yields it in each architecture and nothing re-signs after
      # Tauri. Ad hoc mode skips, and lists, the checks an ad hoc identity
      # cannot pass; the release draft runs the same script in release mode.
      - name: Test the release bundle checker
        run: .github/scripts/check-bundle-signature-test.sh

      - name: Check the bundle with the release bundle checker in ad hoc mode
        run: .github/scripts/check-bundle-signature.sh - target/universal-apple-darwin/release/bundle/macos/AgentSweep.app

      # Release checklist item 16, and the dependency list cargo auditable
      # embeds, checked in each architecture of each sidecar.
      - name: Check that every executable is universal and every sidecar auditable
        run: |
          macos=target/universal-apple-darwin/release/bundle/macos/AgentSweep.app/Contents/MacOS
          for binary in agentsweep-menubar agentsweepd agentsweep agentsweep-apple-judge; do
            archs="$(lipo -archs "$macos/$binary")"
            echo "$binary: $archs"
            for arch in arm64 x86_64; do
              case " $archs " in
                *" $arch "*) ;;
                *) echo "$binary lacks $arch" >&2; exit 1 ;;
              esac
            done
          done
          for binary in agentsweepd agentsweep; do
            for arch in arm64 x86_64; do
              if ! otool -arch "$arch" -l "$macos/$binary" | grep -q 'sectname .dep-v0'; then
                echo "$binary ($arch) carries no .dep-v0 dependency list" >&2
                exit 1
              fi
            done
          done

      # The Apple judgement helper as the bundle carries it: signed with the
      # hardened runtime, Foundation Models linked weakly so it loads on macOS
      # 14, and answering on stdout without a crash. A runner has no Apple
      # Intelligence, so the check is held to its shape, not its value.
      - name: Check the Apple judgement helper in the bundle
        run: |
          judge=target/universal-apple-darwin/release/bundle/macos/AgentSweep.app/Contents/MacOS/agentsweep-apple-judge
          codesign -dvv "$judge" 2>&1 | grep 'flags=.*runtime'
          for arch in arm64 x86_64; do
            otool -arch "$arch" -L "$judge" | grep 'FoundationModels.*weak'
          done
          check="$(echo '{"command":"check"}' | "$judge")"
          echo "check: $check"
          echo "$check" | grep -q '"available":'
          echo "$check" | grep -q '"model_version":'
          status=0
          malformed="$(echo 'not json' | "$judge")" || status=$?
          test "$status" -eq 1
          test "$malformed" = '{"error":"malformed_request"}'

  benign-corpus:
    name: Benign corpus
    # The corpus is scanned the way the Surface Adapters see it, and the adapters
    # are the macOS ones, so it runs where the product runs.
    runs-on: macos-14
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        run: .github/scripts/install-toolchain.sh

      # Every source is a public repository pinned to a commit and to the digest
      # of the content taken from it, fetched over plain HTTPS. Asking for the
      # corpus by name turns the offline skip off: a job that fetched nothing
      # and said nothing would be a green tick over an unproven Rule Pack.
      - name: Scan the benign corpus
        env:
          AGENTSWEEP_CORPUS_REQUIRED: "1"
        run: cargo run -p agentsweep-xtask --locked -- benign-corpus

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        run: .github/scripts/install-toolchain.sh

      - name: Check advisories, licences and sources
        run: |
          cargo install --locked cargo-deny
          cargo deny --locked check advisories licenses sources
