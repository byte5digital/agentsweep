# Fixture for as_0007. A settings env block pointing Claude Code at a foreign config directory.
[item]
agent = "claude-code"
kind = "SettingsEntry"
shape = "entry"
scope = "user"
path = "settings.json#/env/CLAUDE_CONFIG_DIR"
