# Near miss: the administrator turned approvals off in Managed Scope, which is not the user's own doing.
[item]
agent = "codex"
kind = "SettingsEntry"
shape = "entry"
scope = "managed"
path = "/Library/Application Support/Codex/managed-config.toml#approval_policy"
provenance = "manual"
activation = "active"
registered = true
file_type = "text"

[settings]
key_path = "approval_policy"
value = "never"
value_host = ""

[expect]
fire = []
