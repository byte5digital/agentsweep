<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome to AgentSweep</title>
    <link rel="stylesheet" href="onboarding.css" />
    <script type="module" src="onboarding.js"></script>
  </head>
  <body>
    <main class="wizard">
      <p class="steps" id="steps"></p>

      <section data-screen="welcome" hidden>
        <h1>Welcome to AgentSweep</h1>
        <p id="welcome-what"></p>
        <p class="promise" id="welcome-promise"></p>
      </section>

      <section data-screen="found" hidden>
        <h1>What was found</h1>
        <ul class="agents" id="agents"></ul>
        <p class="muted" id="none" hidden></p>
        <p class="muted" id="own-lists"></p>
      </section>

      <section data-screen="detail" hidden>
        <h1 id="detail-question"></h1>
        <div class="choices" role="radiogroup">
          <label><input type="radio" name="posture" value="simple" /> <span id="simple"></span></label>
          <label><input type="radio" name="posture" value="developer" /> <span id="developer"></span></label>
        </div>
        <p class="muted" id="detail-later"></p>
      </section>

      <section data-screen="ai" hidden>
        <h1 id="ai-title"></h1>
        <div class="choices cards" id="ai-choices" role="radiogroup"></div>
        <p class="muted" id="ai-others-line" hidden></p>
        <div class="choices cards" id="ai-others" role="radiogroup"></div>
        <p class="muted" id="ai-later"></p>
      </section>

      <section data-screen="background" hidden>
        <h1>Keep watching in the background</h1>
        <div id="background-lines"></div>
        <p class="muted" id="background-disclosure"></p>
        <div class="toggles" id="background-toggles"></div>
        <div class="protected" id="protected" hidden>
          <p id="protected-line"></p>
          <button type="button" id="protected-button"></button>
          <p class="muted" id="protected-sent" hidden></p>
        </div>
      </section>

      <section data-screen="first" hidden>
        <h1 id="first-title"></h1>
        <p class="muted" id="first-waiting" hidden></p>
        <div id="first-done" hidden>
          <p id="first-items"></p>
          <p id="first-baseline"></p>
          <p id="first-stopped-line"></p>
          <ul id="first-stopped"></ul>
          <p class="promise" id="first-result"></p>
        </div>
      </section>

      <footer>
        <button type="button" id="back">Back</button>
        <button type="button" id="next" class="primary">Continue</button>
      </footer>
      <p class="error" id="error" hidden></p>
    </main>

    <dialog id="ollama">
      <form method="dialog">
        <p class="question"></p>
        <div class="lines"></div>
        <div class="buttons">
          <button value="cancel">Cancel</button>
          <button value="ok" class="primary" id="ollama-ok"></button>
        </div>
      </form>
    </dialog>

    <dialog id="consent">
      <p class="title"></p>
      <table><tbody></tbody></table>
      <button type="button" class="link" id="consent-preview"></button>
      <p class="muted" id="consent-preview-text" hidden></p>
      <label>
        <span class="key-label"></span>
        <input type="password" id="consent-key" autocomplete="off" spellcheck="false" />
      </label>
      <p class="muted key-line"></p>
      <div class="buttons">
        <button type="button" id="consent-cancel">Cancel</button>
        <button type="button" class="primary" id="consent-agree"></button>
      </div>
    </dialog>
  </body>
</html>
