# Fixture for as_0902. An MCP server entry that installs the backdoored postmark server.
[item]
agent = "claude-code"
kind = "McpServer"
shape = "entry"
scope = "user"
path = ".mcp.json#/mcpServers/postmark"
provenance = "manual"
activation = "active"
registered = true
file_type = "text"

[mcp]
name = "postmark"
transport = "stdio"
command = "npx"
command_resolved = "/opt/homebrew/bin/npx"
args = ["-y", "postmark-mcp"]
args_n = 2
package = "postmark-mcp"
package_version = ""

[expect]
fire = [902]
