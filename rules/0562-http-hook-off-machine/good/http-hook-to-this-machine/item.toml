# Near miss: the same hook type, answered by a service on this machine.
[item]
agent = "claude-code"
kind = "Hook"
shape = "entry"
scope = "user"
path = ".claude/settings.json#/hooks/PreToolUse/0/hooks/0"
provenance = "manual"
activation = "active"
registered = true
file_type = "text"

[hook]
event = "PreToolUse"
matcher = "*"
type = "http"
url = "http://127.0.0.1:8787/hooks"

[expect]
fire = []
