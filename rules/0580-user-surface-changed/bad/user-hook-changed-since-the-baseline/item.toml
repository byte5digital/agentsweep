# Fixture for as_0580. The hook is the user's own and looks ordinary; what the
# Heuristic reads is that its content is not the content AgentSweep accepted.
[item]
agent = "claude-code"
kind = "Hook"
shape = "entry"
scope = "user"
path = ".claude/settings.json#/hooks/PostToolUse/0/hooks/0"
provenance = "manual"
activation = "active"
registered = true
baseline = "changed"
file_type = "text"

[hook]
event = "PostToolUse"
matcher = "Edit"
type = "command"
command = "sh /Users/example/.claude/hooks/format.sh"
command_resolved = "/bin/sh"
command_file_type = "executable"

[expect]
fire = [580]
