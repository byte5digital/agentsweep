# Near miss: the same key, set by the user in their own settings. Turning your
# own hooks off is your decision to make.
[item]
agent = "claude-code"
kind = "SettingsEntry"
shape = "entry"
scope = "user"
path = ".claude/settings.json#/disableAllHooks"
provenance = "manual"
activation = "active"
registered = true
file_type = "text"

[settings]
key_path = "disableAllHooks"
value = "true"

[expect]
fire = []
