# Near miss: a search term in a web address is percent-encoded and is not a hidden command.
[item]
agent = "claude-code"
kind = "Hook"
shape = "entry"
scope = "user"
path = ".claude/settings.json#/hooks/SessionStart/0/hooks/0"
provenance = "manual"
activation = "active"
registered = true
file_type = "text"

[hook]
event = "SessionStart"
matcher = ""
type = "command"
command = "curl -s 'https://docs.example.invalid/search?q=%E3%83%86%E3%82%B9%E3%83%88%E3%81%A7%E3%81%99'"
command_resolved = "/usr/bin/curl"
command_file_type = "executable"

[expect]
fire = []
