# The benign corpus: public content that is known to be good.
#
# Spec section 4.2 puts a precision bar on the Rule tier, and two of its five
# conditions are measured here: zero T1 hits on the benign corpus, and a hit
# count per Heuristic with every weight 3 Heuristic at zero. Every source below
# is a real, public repository, pinned to the commit it was read at, fetched
# over plain HTTPS at test time and never committed. No git binary is ever run:
# an archive comes from `codeload.github.com/<owner>/<repo>/tar.gz/<commit>` and
# a single file from `raw.githubusercontent.com/<owner>/<repo>/<commit>/<path>`.
#
# `sha256` pins the content, not the transfer. For a file it is the digest of
# the file's bytes; for an archive it is the digest of a canonical rendering of
# the paths this manifest takes and their bytes, in path order, because the
# tarball GitHub generates is not promised to be byte-stable while its content
# is. A moved tag or an edited file therefore fails the fetch, and re-recording
# a hash is a commit somebody reviews. `cargo run -p agentsweep-xtask --
# benign-corpus --record` writes the hashes of what it fetched back into this
# file.
#
# Each source says how it is presented, because a Rule reads the views the
# Surface Adapter computed and not just the bytes. The presentations are:
#
#   marketplace       the path is a marketplace clone, registered in the Agent's
#                     own marketplace registry
#   plugin-trees      each immediate subdirectory of the path is one installed
#                     plugin, with the MCP and hook files it bundles
#   skill-tree        the path is one skill directory
#   skill-trees       each immediate subdirectory of the path is one skill
#   instruction-file  the file is the instruction file of a project root of its
#                     own, CLAUDE.md for Claude Code and AGENTS.md for Codex
#
# `agent` says whose Surfaces the source is laid out on; it defaults to
# claude-code.

# The Anthropic skills repository: the marketplace it is, and every skill in it.
[[archive]]
name = "anthropic-agent-skills"
owner = "anthropics"
repo = "skills"
commit = "34040c9c568585f6929bedeaad110ad08f079624"
sha256 = "0a1924a4767ef5bfd3bc1c20037c91e7b835a5bd6010e4217617db9686ef2b45"
take = [
    { path = "", present = "marketplace" },
    { path = "skills", present = "skill-trees" },
    { path = "template", present = "skill-tree" },
    { path = "README.md", present = "instruction-file" },
]

# The official plugin marketplace: the clone, the plugins Anthropic ships and
