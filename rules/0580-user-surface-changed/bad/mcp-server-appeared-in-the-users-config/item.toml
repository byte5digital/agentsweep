# Fixture for as_0580. A server that was not in the user's configuration the
# last time AgentSweep enumerated it, on a Surface that was already covered.
[item]
agent = "claude-code"
kind = "McpServer"
shape = "entry"
scope = "user"
path = ".claude.json#/mcpServers/notes"
provenance = "manual"
activation = "active"
registered = true
baseline = "added"
file_type = "text"

[mcp]
name = "notes"
transport = "stdio"
command = "node"
command_resolved = "/usr/local/bin/node"
args = ["/opt/notes-mcp/server.js"]
args_n = 1

[expect]
fire = [580]
