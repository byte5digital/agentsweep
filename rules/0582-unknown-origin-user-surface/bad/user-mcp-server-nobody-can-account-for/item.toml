# Fixture for as_0582. The same question about an MCP server: it starts a
# process on every session and nothing says who added it.
[item]
agent = "claude-code"
kind = "McpServer"
shape = "entry"
scope = "user"
path = ".claude.json#/mcpServers/helper"
provenance = "unknown"
activation = "active"
registered = true
file_type = "text"

[mcp]
name = "helper"
transport = "stdio"
command = "node"
command_resolved = "/usr/local/bin/node"
args = ["/opt/helper-mcp/server.js"]
args_n = 1

[expect]
fire = [582]
