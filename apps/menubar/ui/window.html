<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgentSweep</title>
    <link rel="stylesheet" href="window.css" />
    <script type="module" src="window.js"></script>
  </head>
  <body>
    <div class="frame">
      <nav class="sidebar" aria-label="AgentSweep">
        <p class="brand">AgentSweep</p>
        <div id="sidebar"></div>
      </nav>

      <div class="content">
        <header>
          <p class="off" id="off" hidden></p>
          <p class="wait" id="actions-wait" hidden></p>
        </header>

        <section class="folder" id="folder" hidden>
          <h2>Scan a folder</h2>
          <p class="verdict" id="folder-verdict"></p>
          <p class="muted" id="folder-root"></p>
          <p id="folder-summary"></p>
          <p class="muted" id="folder-ambiguous"></p>
          <p class="muted" id="folder-recorded"></p>
          <p class="muted" id="folder-pack"></p>
          <div id="folder-cards"></div>
        </section>

        <!-- One pane per sidebar entry. Overview and the two Finding panes
             have content; each later screen fills its own. -->
        <main id="panes">
          <section class="pane" data-pane="overview" hidden>
            <h2 class="pane-title"></h2>
            <!-- The integrity and Protection banners take this place
                 (spec section 8.6). -->
            <div id="overview-banner" hidden></div>
            <p class="sentence" id="overview-sentence"></p>
            <div id="overview-body">
              <ul class="agents" id="overview-agents"></ul>
              <!-- "N projects not checked" with Check now, for projects that
                   Need Permission (spec section 8.1). -->
              <div id="overview-permission" hidden></div>
              <!-- "Gate off in this project", one line per affected project
                   (spec section 8.1). -->
              <div id="overview-gate" hidden></div>
              <p class="muted" id="overview-last-check"></p>
              <p class="muted" id="overview-rules"></p>
              <div class="scan" id="overview-scan">
                <button type="button" id="scan-now">Scan now</button>
                <button type="button" id="scan-folder">Scan a folder</button>
                <p class="muted" id="scan-line"></p>
              </div>
              <p class="id summary" id="overview-summary" hidden></p>
              <!-- "AI check: 3 of 12" while the queue runs, in the Developer
                   Posture (spec section 6.4). -->
              <p class="muted" id="overview-ai-check" hidden></p>
            </div>
          </section>
          <section class="pane" data-pane="threats" hidden>
            <h2 class="pane-title"></h2>
            <p class="muted empty" hidden>Nothing is open.</p>
            <div class="split">
              <div class="list" role="list"></div>
              <div class="detail"></div>
            </div>
            <!-- The Developer Posture only: Items in the Ambiguous Band, which
                 are never Findings (spec sections 4.3 and 8.4). -->
            <section class="ambiguous-items" hidden>
              <h3>Ambiguous Items</h3>
              <p class="muted">Their Score fell in the Ambiguous Band. They are not Findings and nothing is asked of you.</p>
              <div class="list"></div>
            </section>
          </section>
          <section class="pane" data-pane="exposures" hidden>
            <h2 class="pane-title"></h2>
            <p class="muted empty" hidden>Nothing is open.</p>
            <div class="split">
              <div class="list" role="list"></div>
              <div class="detail"></div>
            </div>
          </section>
          <section class="pane" data-pane="quarantine" hidden>
            <h2 class="pane-title"></h2>
          </section>
          <section class="pane" data-pane="activity" hidden>
            <h2 class="pane-title"></h2>
          </section>
          <section class="pane" data-pane="settings" hidden>
            <h2 class="pane-title"></h2>
            <p class="note" id="settings-note" hidden></p>
            <p class="muted" id="settings-off" hidden>
              Settings can be changed while AgentSweep is running.
            </p>
            <p class="muted" id="settings-answer" role="status"></p>

            <div class="setting" id="settings-detail">
              <h3></h3>
              <div class="choices" role="radiogroup"></div>
            </div>

            <!-- The AI check takes this place (spec section 8.10). -->
            <div class="setting" id="settings-ai-check" hidden></div>

            <div class="setting" id="settings-background">
              <h3></h3>
              <p class="muted disclosure"></p>
              <div class="toggles"></div>
              <!-- Stop the AI from using flagged items, the Gate switch,
                   takes this place (spec section 8.10). -->
              <div id="settings-gate" hidden></div>
            </div>

            <div class="setting" id="settings-cli">
              <h3></h3>
              <p class="muted line"></p>
              <button type="button" class="install"></button>
              <div class="cli-answer" role="status"></div>
            </div>

            <div class="setting" id="settings-advanced">
              <h3></h3>
              <p class="muted dirs-line"></p>
              <div class="dirs"></div>
              <!-- The Ollama address and the Claude model id take this place
                   (spec section 8.10). -->
              <div id="settings-advanced-ai" hidden></div>
              <div class="sub" id="settings-everything">
                <h4></h4>
                <div class="lines"></div>
                <button type="button" class="open"></button>
              </div>
              <div class="sub" id="settings-rules">
                <h4></h4>
                <p class="muted line"></p>
                <p class="id path"></p>
                <button type="button" class="show"></button>
              </div>
            </div>

            <div class="setting" id="settings-not-protected">
              <h3></h3>
              <p class="paragraph"></p>
              <button type="button" class="link"></button>
            </div>

            <!-- Uninstall AgentSweep takes this place (spec section 9.6). -->
            <div class="setting" id="settings-uninstall" hidden></div>
          </section>
        </main>
      </div>
    </div>

    <dialog id="confirm">
      <form method="dialog">
        <p class="message" id="confirm-question"></p>
        <div id="confirm-lines"></div>
        <div class="actions">
          <button value="cancel">Cancel</button>
          <button value="ok" class="primary" id="confirm-ok"></button>
        </div>
      </form>
    </dialog>

    <!-- A Restore that met something else at the original place (spec
         section 5.4): the two choices, each its own Restore. -->
    <dialog id="conflict">
      <form method="dialog">
        <p class="message" id="conflict-message"></p>
        <div class="actions">
          <button value="cancel">Cancel</button>
          <span id="conflict-choices"></span>
        </div>
      </form>
    </dialog>
  </body>
</html>
