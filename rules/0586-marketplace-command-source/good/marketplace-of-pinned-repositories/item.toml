# Near miss: every listing is a repository at a pinned ref, which is what almost every catalogue is.
[item]
agent = "claude-code"
kind = "Marketplace"
shape = "tree"
scope = "user"
path = ".claude/plugins/marketplaces/awesome-plugins"
provenance = "marketplace"
provenance_ref = ""
